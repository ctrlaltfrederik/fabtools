<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#FFFFFF" />
<title>Fabric Capacity Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; color: #3C3C3C; }
  body { font-family: "Mulish", "Century Gothic", Arial, sans-serif; min-height: 100vh; }
  #loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #999999; font-size: 14px; padding: 24px; text-align: center; gap: 8px; }
  #errbox { display: none; padding: 20px; background: #FFF0F0; color: #941914; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; line-height: 1.5; border-left: 3px solid #C42828; }
</style>
</head>
<body>
<div id="root"><div id="loading">Loading capacity advisor…</div></div>
<pre id="errbox"></pre>

<script>
window.addEventListener('error', function(e) {
  var box = document.getElementById('errbox');
  box.style.display = 'block';
  box.textContent = 'ERROR: ' + (e.message || e.error || e) + '\nat line ' + (e.lineno || '?');
  var l = document.getElementById('loading');
  if (l) l.style.display = 'none';
});
</script>

<script>
(function() {
  var useMemo = React.useMemo;
  var useState = React.useState;
  try {
    "use strict";
/* ================================================================
   Fabric Capacity Advisor — Part 1 (v3, simplified)

   Design principle: don't fake precision. The user knows project size,
   workload archetype, and PBI audience. The rest is either tier-encoded
   (visible in the trace, not asked) or a genuine multiplier the user
   actually knows (Dataflow Gen2 usage, AI intensity, RTI scale).

   Grounded in:
   - delaware's internal capacity-sizing benchmarks (S/M/L tier archetypes mapped to F-SKUs)
   - MS Learn: 5-min min interactive smoothing, 24-hr background
   - MS Learn: Dataflow Gen2 mashup engine 16 CU/s, staging SQL 6 CU/s
   - Community benchmark (third-party, NOT Microsoft): DF Gen2 = 2.7× a pipeline
     Copy activity and 1.8× a Spark notebook for the same 104M-row extract-load
     (AlphaBOLD, Jul 2026, Trial F64). The ordering Copy < notebook < DF Gen2 is
     stable across two independent tests; the magnitude is not — the observed
     Gen2-vs-Copy spread is 2.7× to 23.7×, and the high end is pre-2026 pricing.
     NB: the widely-quoted "DF Gen2 = 5-9×" figure previously cited here is a
     misattribution. It comes from a mid-2024 community thread, "Dataflow Gen2
     using 5x to 9x more CU than Gen1" — Gen2 vs Dataflow Gen1, not vs a
     notebook — and predates tiered Standard Compute pricing. Do not reuse it.
     See 4_resources/patterns/fabric-workload-cu-efficiency.md for provenance.
   - Azure pricing checked 2026-09-11 (Azure Retail Prices API): F-SKU PAYG,
     40.5% reservation discount (1yr), 3yr reservation = exactly 3x the 1yr rate
   - PBI Pro €12.10/user/mo, PPU €20.80/user/mo (Microsoft nl-be pricing page,
     Eurozone ex-VAT, checked 2026-09-11), F64 licensing threshold. The old
     €14/€24 figures were carried over from Microsoft's US $14/$24 page —
     apparently a US-dollar figure mistaken for EUR, not real EUR drift.
   - OneLake storage €0.022/GB/month (hot tier, North Europe)
   ================================================================ */

const SKUS = [
// PAYG prices: North Europe region, EUR. €0.1631/CU/hr × 730 hr/month,
// checked 2026-09-11 against the Azure Retail Prices API.
{
  name: "F2",

// Flagged, deliberately not fixed.
// This was previously described as "startup + execution overhead". Microsoft states

// initialisation, so startup cannot be what this coefficient captures.
// https://learn.microsoft.com/fabric/data-engineering/billing-capacity-management-for-spark

// sessions accrue CU until stopped — and (b) ALLOCATED vCores, not utilised ones.
// Scale of the gap: a single Medium node (8 vCore = 4 CU/s) idling out its 20-minute
// timeout is ~4,800 CU-s, roughly 19× the 250 modelled here, and more again on a
// multi-node pool. So the coefficient is right to exist, is attributed to the wrong
// cause, and understates a real cost driver.

//     PLUS each activity is rounded up to 1-minute minimum
//   - Net: ~6 CU/s during copy runtime for typical workloads
//
// Dataflow Gen2 (Power Query mashup engine) — the expensive one:
//   - Standard Compute CI/CD: 12 CU/s (first 10 min), 1.5 CU/s after
//   - Standard Compute non-CI/CD: 16 CU/s sustained
//   - Staging (when enabled, which is default): +6 CU/s concurrent
//   - Net: 12-18 CU/s during runtime — 2-3× a Data Factory Copy at same scale

//     same extract-load. NOT "5-9× a notebook" — see the header block: that
//     figure is Gen2 vs Dataflow Gen1, mid-2024, pre-tiered-pricing.

const DEFAULT_INPUT = {

/* ----------------------------------------------------------------
   CALCULATION
   Computes daily CU-sec broken into background and interactive,
   applies smoothing, returns required CU/s and the trace.

   `priceMode` ("payg" | "reserved") — chosen up front, drives every
   capacity cost figure used for the recommendation and licensing
   comparison, so the SKU/licensing-path winner reflects the pricing
   basis from the start rather than being computed on PAYG and only
   relabeled later.
   ---------------------------------------------------------------- */
function compute(input, priceMode = "payg") {
  const tier = TIERS[input.tier];
  const cost = sku => priceMode === "reserved" ? sku.payg * (1 - RESERVATION_DISCOUNT) : sku.payg;
  const arch = ARCHETYPES[input.archetype];

  // No-op passthrough — the hook where measured usage (replacing the modeled
  // input × coefficient math below) would plug back in if reintroduced.
  const withObserved = entry => entry;

  // Daily-touched data volume in GB (drives Spark + pipeline work)
  const dailyTouchedGB = tier.platformTB * (tier.dailyChangePct / 100) * GB_PER_TB;

  // --- Background workloads ---
  const background = [];

  // Spark / data engineering — volume-driven processing
  const sparkCuSec = dailyTouchedGB * arch.sparkCuSecPerGB * 60;
  background.push(withObserved({
    key: "spark",
    label: "Spark / data engineering",
    cuSec: sparkCuSec,
    formula: `${fmt(dailyTouchedGB)} GB/day × ${arch.sparkCuSecPerGB} CU-s/GB × 60`
  }));

  // Notebook / Spark execution overhead — count-driven (startup, kernel, write-back).
  // This is independent of data volume and dominates for small but compute-heavy
  // projects like ML training workloads.
  const notebookRuns = input.notebookRuns ?? tier.notebookRuns;
  const notebookCuSec = notebookRuns * NOTEBOOK_CU_PER_RUN;
  background.push(withObserved({
    key: "notebook",
    label: "Notebook executions",
    cuSec: notebookCuSec,
    formula: `${notebookRuns} runs/day × ${NOTEBOOK_CU_PER_RUN} CU-s/run`
  }));

  // Data Factory pipelines — Copy Activity + orchestration.
  // Runtime hours come from tier defaults (S=0.5, M=2, L=6, XL=16) × archetype mult.
  const dfHours = (input.pipelineHours ?? tier.pipelineHours) * arch.pipelineHoursMultiplier;
  const dfCuSec = dfHours * 3600 * DATA_FACTORY_CU_PER_SEC;
  background.push(withObserved({
    key: "datafactory",
    label: "Data Factory (Copy + orchestration)",
    cuSec: dfCuSec,
    formula: `${fmt(dfHours, 1)} hrs/day × ${DATA_FACTORY_CU_PER_SEC} CU/s (Copy Activity × ITO 4)`
  }));

  // Dataflow Gen2 — separate, much more expensive line. Default is "none".
  // hoursPerDayMult scales tier's pipeline hours to estimate DF Gen2 runtime
  // (e.g. "some" = 50% of DF runtime hours is DF Gen2; "heavy" = 100% replaced).
  const dg2 = DATAFLOW_GEN2_OPTIONS[input.dfGen2];
  if (dg2.cuPerSec > 0) {
    const dg2Hours = dfHours * dg2.hoursPerDayMult;
    const dg2CuSec = dg2Hours * 3600 * dg2.cuPerSec;
    background.push(withObserved({
      key: "dataflow_gen2",
      label: `Dataflow Gen2 (${input.dfGen2})`,
      cuSec: dg2CuSec,
      formula: `${fmt(dg2Hours, 1)} hrs/day × ${dg2.cuPerSec} CU/s (${dg2.note})`
    }));
  }

  // Largest semantic model — user override wins over the tier default.
  // Used by BOTH the refresh CU line below and the SKU memory-bound check,
  // so the two halves of the calculation always assume the same model size.
  const modelGB = input.pbiModelGB ?? tier.pbiModelGB;

  // Power BI refresh — heavier for PBI-only archetype (more refreshes typical,
  // and Power Query transformations baked into refresh)
  const refreshIntensity = arch.refreshIntensityMultiplier ?? 1.0;
  const pbiRefreshCuSec = modelGB * arch.pbiRefreshCuSecPerGB * input.refreshesPerDay * 60 * refreshIntensity;
  background.push(withObserved({
    key: "pbi_refresh",
    label: refreshIntensity > 1 ? `Power BI refresh (${refreshIntensity}× heavy)` : "Power BI refresh",
    cuSec: pbiRefreshCuSec,
    formula: `${modelGB} GB × ${arch.pbiRefreshCuSecPerGB} CU-s/GB × ${input.refreshesPerDay} refreshes × 60${refreshIntensity > 1 ? ` × ${refreshIntensity}` : ""}`
  }));

  // Copilot for Power BI — only on PBI archetype, only when user enables it.
  // MS Learn: classified as background, 100 CU-sec/1k input + 400 CU-sec/1k output.
  // Typical query: 2,000 input + 500 output tokens = 400 CU-sec/query
  // (matches COPILOT_INPUT_CU_PER_1K / COPILOT_OUTPUT_CU_PER_1K / COPILOT_CU_PER_QUERY).
  // Active users assumed at ~25% of viewer count (only some users use Copilot).
  if (input.archetype === "powerbi" && input.copilotIntensity && input.copilotIntensity !== "none") {
    const ci = COPILOT_INTENSITY[input.copilotIntensity];
    const copilotActiveUsers = Math.round(input.pbiViewers * 0.25);
    const copilotQueriesPerDay = copilotActiveUsers * ci.queriesPerUser;
    const copilotCuSec = copilotQueriesPerDay * COPILOT_CU_PER_QUERY;
    background.push(withObserved({
      key: "copilot",
      label: `Copilot for Power BI (${ci.label})`,
      cuSec: copilotCuSec,
      formula: `${copilotActiveUsers} active users × ${ci.queriesPerUser} queries/day × ${COPILOT_CU_PER_QUERY} CU-s/query`
    }));
  }

  // RTI ingest (realtime archetype only)
  if (input.archetype === "realtime") {
    const rti = RTI_SIZES[input.rtiSize];
    const rtiCuSec = rti.gbPerDay * arch.rtiCuSecPerGBIngest * 60;
    background.push(withObserved({
      key: "rti",
      label: `RTI ingest (${rti.label})`,
      cuSec: rtiCuSec,
      formula: `${rti.gbPerDay} GB/day × ${arch.rtiCuSecPerGBIngest} CU-s/GB × 60`
    }));
  }

  // --- Interactive workloads ---
  const interactive = [];

  // Power BI viewing — concurrent users at peak.
  // Calibrated against MS estimator + community guidance: typical enterprise
  // PBI usage runs 2-5% concurrent at peak, not the 15% the previous version
  // assumed. The user can override via the concurrency multiplier.
  const peakConcurrent = Math.max(5, Math.round(input.pbiViewers * (input.peakConcurrentPct / 100)));
  const pbiViewCuSec = peakConcurrent * tier.pbiActiveHours * 14 * 60;
  interactive.push(withObserved({
    key: "pbi_view",
    label: "Power BI viewing",
    cuSec: pbiViewCuSec,
    formula: `${peakConcurrent} peak concurrent (${input.peakConcurrentPct}% of ${input.pbiViewers}) × ${tier.pbiActiveHours} hrs × 14 CU-s/user-hr × 60`
  }));

  // Paginated reports add ~30% on top of PBI viewing if enabled
  if (input.hasPaginated) {
    const paginatedCuSec = pbiViewCuSec * 0.3;
    interactive.push(withObserved({
      key: "paginated",
      label: "Paginated reports",
      cuSec: paginatedCuSec,
      formula: `+30% on Power BI viewing baseline`
    }));
  }

  // AI / Copilot (ai archetype only)
  if (input.archetype === "ai") {
    const ai = AI_INTENSITY[input.aiIntensity];
    const aiCuSec = ai.tokensKPerDay * arch.aiCuSecPer1kTokens;
    interactive.push(withObserved({
      key: "ai",
      label: `AI / Copilot (${ai.label.split(" (")[0]})`,
      cuSec: aiCuSec,
      formula: `${fmt(ai.tokensKPerDay)}k tokens × ${arch.aiCuSecPer1kTokens} CU-s/1k`
    }));
  }

  // --- Aggregate & smoothing ---
  const interactiveDaily = interactive.reduce((s, x) => s + x.cuSec, 0);

      fabricDevRes = 0;

    const storage = opts.monthlyStorageCost * growthFactor;

const fmt = (n, d = 0) => {
  const num = Number(n || 0);
  const sign = num < 0 ? "-" : "";

  return sign + (fracPart ? `${grouped},${fracPart}` : grouped);

/* ============================================================
   delaware brand styling — light theme
   - White background, Light Gray cards, Text Gray text

   - Teal #72C4BF for informational callouts

.advisor {
  font-family: "Mulish", "Century Gothic", "Arial", sans-serif;
  color: #3C3C3C;
  max-width: 1040px;
  margin: 0 auto;
  padding: 28px 24px 64px;
  background: #FFFFFF;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.advisor * { box-sizing: border-box; }

/* HERO */
.hero {
  display: flex; justify-content: space-between; align-items: flex-end;
  border-bottom: 2px solid #C42828; padding-bottom: 22px; margin-bottom: 32px; gap: 32px;
}
.hero-brand {
  display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
}
.hero-brand .kicker { margin: 0; }
.kicker {
  font-size: 11px; text-transform: lowercase; letter-spacing: 0.04em;
  color: #C42828; margin-bottom: 8px; font-weight: 600;
}
.hero h1 {
  font-size: 32px; font-weight: 700; margin: 0 0 10px;
  letter-spacing: -0.01em; line-height: 1.12; color: #3C3C3C;
  text-transform: lowercase;
}
.lede {
  font-size: 14px; line-height: 1.6; color: #3C3C3C; margin: 0; max-width: 480px;
}
.hero-stat {
  text-align: right; border-left: 2px solid #F5F5F5; padding-left: 24px;
  flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end;
}
.hero-pricing-seg { max-width: 200px; margin-bottom: 10px; }
.stat-num {
  font-size: 48px; font-weight: 700; line-height: 1; color: #C42828;

}
.stat-cu { font-size: 11px; color: #999999; letter-spacing: 0.1em; margin-top: 6px; text-transform: uppercase; }
.stat-cost { font-size: 13px; color: #3C3C3C; margin-top: 6px; }
.stat-cost-year { font-size: 12px; color: #999999; margin-top: 2px; }
.pricing-checked-note {

.docs-link:hover { color: #C42828; text-decoration: underline; }

/* BLOCKS */
.block { margin-bottom: 44px; }
.block-head { margin-bottom: 20px; }
.block-head h2 {
  font-size: 20px; font-weight: 700; margin: 0 0 6px;

}

  background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 8px;
  padding: 14px; cursor: pointer; text-align: left;
  display: flex; flex-direction: column;
  transition: all 0.15s; color: #3C3C3C;
  font-family: inherit;
}
.tier-card:hover { border-color: #EF463C; box-shadow: 0 2px 8px rgba(239, 70, 60, 0.12); }
.tier-card.on {
  background: rgba(196, 40, 40, 0.05);
  border-color: #C42828;
  box-shadow: 0 0 0 1px #C42828;
}
.tier-card.on .tier-letter { color: #C42828; }
.tier-letter {
  font-size: 10px; letter-spacing: 0.18em; color: #999999; font-weight: 700;
  text-transform: uppercase;
}
.tier-label {
  font-size: 17px; font-weight: 600; line-height: 1.1; margin-top: 4px; color: #3C3C3C;
  text-transform: lowercase;
}
.tier-range { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; margin-top: 6px; color: #3C3C3C; }
.tier-raw-hint { font-family: ui-monospace, monospace; font-size: 11px; margin-top: 4px; font-style: italic; color: #999999; }
.tier-row-hint { font-family: ui-monospace, monospace; font-size: 11px; margin-top: 2px; color: #999999; }
.tier-desc { font-size: 12px; margin-top: 10px; color: #3C3C3C; font-weight: 500; }
.tier-meta { font-size: 11px; margin-top: 4px; color: #999999; line-height: 1.55; }

/* ARCHETYPE CARDS */
.arch-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.arch-card {
  background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 8px;
  padding: 14px; cursor: pointer; text-align: left; transition: all 0.15s; color: #3C3C3C;
  font-family: inherit;
}
.arch-card:hover { border-color: #EF463C; box-shadow: 0 2px 8px rgba(239, 70, 60, 0.12); }
.arch-card.on {
  background: rgba(196, 40, 40, 0.05);
  border-color: #C42828;
  box-shadow: 0 0 0 1px #C42828;
}
.arch-card.on .arch-label { color: #3C3C3C; }
.arch-label { font-size: 15px; font-weight: 600; color: #3C3C3C; text-transform: lowercase; }
.arch-engines { font-family: ui-monospace, monospace; font-size: 11px; color: #C42828; margin-top: 4px; font-weight: 600; }
.arch-desc { font-size: 12px; color: #3C3C3C; margin-top: 6px; line-height: 1.45; }

/* AUDIENCE + MULTIPLIERS */
.audience-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.mult-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  color: #3C3C3C; font-weight: 700;
  display: inline-flex; align-items: center;
}
.field-label-icon {
  display: inline-flex; align-items: center; margin-right: 5px;
  vertical-align: middle;
}
.field-label-icon svg, .field-label-icon img { display: block; }
.field-hint { font-size: 11px; color: #999999; margin-top: 2px; font-style: italic; }

/* MODEL SIZE T-SHIRT PICKER */
.model-size-picker {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  margin-bottom: 8px;
}
.size-chip {
  background: #FFFFFF; border: 1px solid #C8C8C8; border-radius: 6px;
  padding: 6px 4px; cursor: pointer; text-align: center;
  font-family: inherit; transition: all 0.15s;
  display: flex; flex-direction: column; gap: 2px;
}
.size-chip:hover { border-color: #EF463C; box-shadow: 0 1px 4px rgba(239, 70, 60, 0.12); }
.size-chip.on {
  background: rgba(196, 40, 40, 0.06);
  border-color: #C42828;
  box-shadow: 0 0 0 1px #C42828;
}
.size-chip.on .size-chip-label { color: #C42828; }
.size-chip-label {
  font-size: 11px; font-weight: 700; color: #3C3C3C;
  letter-spacing: 0.04em;
}
.size-chip-range {
  font-family: ui-monospace, monospace;
  font-size: 9px; color: #999999; line-height: 1.2;
}
.model-size-numeric {
  display: flex; align-items: center; gap: 8px;
}
.model-size-numeric-label {
  font-size: 11px; color: #999999; font-style: italic;
  flex-shrink: 0;
}
.model-size-numeric .num-input { flex: 1; }

/* NUMBER INPUTS — explicit overrides to defeat iOS Safari defaults */
.num-input {
  display: flex; align-items: stretch; background: #FFFFFF; border: 1px solid #C8C8C8;
  border-radius: 6px; overflow: hidden;
}
.num-input:focus-within { border-color: #EF463C; box-shadow: 0 0 0 2px rgba(239, 70, 60, 0.15); }
.num-input input,
.num-input input[type="number"] {
  flex: 1; background-color: #FFFFFF !important; background-image: none !important;
  border: none !important; padding: 10px 12px;
  color: #3C3C3C !important; -webkit-text-fill-color: #3C3C3C !important;
  caret-color: #EF463C;
  font-size: 16px; font-family: inherit; min-width: 0;
  appearance: none !important; -webkit-appearance: none !important; -moz-appearance: textfield !important;
  border-radius: 0;
  box-shadow: none !important;
}
.num-input input:focus,
.num-input input[type="number"]:focus {
  outline: none; background-color: #FCFCFC !important;
}
.num-input input::-webkit-outer-spin-button,
.num-input input::-webkit-inner-spin-button {
  -webkit-appearance: none !important; margin: 0;
}
.num-input-suffix {
  font-size: 11px; color: #999999; padding: 0 12px; border-left: 1px solid #E5E5E5;
  background: #F5F5F5;
  align-self: stretch; display: flex; align-items: center; flex-shrink: 0;
}

.seg { display: flex; background: #FFFFFF; border: 1px solid #C8C8C8; border-radius: 6px; overflow: hidden; }
.seg button {
  flex: 1; background: transparent; border: none; padding: 9px;
  cursor: pointer; font-size: 12px; color: #999999;
  border-right: 1px solid #E5E5E5; text-transform: lowercase;
  font-family: inherit; font-weight: 600; transition: all 0.15s;
}
.seg button:last-child { border-right: none; }
.seg button:hover { background: #F5F5F5; color: #3C3C3C; }
.seg-on { background: #C42828 !important; color: #FFFFFF !important; font-weight: 700; }

.toggle {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 14px; background: #FFFFFF; border: 1px solid #C8C8C8;
  border-radius: 6px; cursor: pointer; text-align: left; transition: all 0.15s;
}
.field .toggle { margin-top: 8px; }
.toggle:hover { border-color: #EF463C; }
.toggle.on { background: rgba(196, 40, 40, 0.05); border-color: #C42828; }
.toggle-dot {
  width: 10px; height: 10px; border-radius: 50%; border: 1px solid #999999;
  margin-top: 4px; flex-shrink: 0;
}
.toggle.on .toggle-dot { background: #C42828; border-color: #C42828; }
.toggle-label { font-weight: 600; font-size: 13px; color: #3C3C3C; }
.toggle-sub { font-size: 11px; color: #999999; margin-top: 2px; }

/* RESULT */
.result-block {
  background: #F5F5F5; border: 1px solid #E5E5E5; border-radius: 10px; padding: 24px;
}
.result-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 22px; }
.card {
  background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 8px;
  padding: 16px; color: #3C3C3C;
}
.card.primary {
  background: linear-gradient(135deg, rgba(196, 40, 40, 0.05), rgba(238, 118, 132, 0.08));
  border-color: #C42828;
  box-shadow: 0 0 0 1px rgba(196, 40, 40, 0.3);
}
.card-kicker {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: #999999; margin-bottom: 6px; font-weight: 700;
}
.card.primary .card-kicker { color: #C42828; }
.card-number {
  font-size: 44px; font-weight: 700; line-height: 1; color: #3C3C3C;
  letter-spacing: -0.02em;
}
.card.primary .card-number { color: #C42828; }
.card-number.small { font-size: 26px; }
.card-sub { font-size: 12px; margin-top: 6px; color: #999999; }
.confidence {
  font-size: 11px; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid rgba(196, 40, 40, 0.2); color: #3C3C3C;
}
.env-list { list-style: none; padding: 0; margin: 0; font-size: 12px; }
.env-list li {
  display: flex; justify-content: space-between; padding: 5px 0;
  border-bottom: 1px dotted #E5E5E5; color: #3C3C3C;
}
.env-list li:last-child { border-bottom: none; }
.env-list strong { color: #C42828; }

.subsection { margin-bottom: 24px; }
.subsection h3 {
  font-size: 12px; text-transform: lowercase; letter-spacing: 0.06em; color: #C42828;
  font-weight: 700; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #C42828;
  display: flex; align-items: center; gap: 6px;
}
.subsection-collapsible { padding: 0; }
.subsection-collapsible > .collapse-summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 8px; margin-bottom: 12px; border-bottom: 2px solid #C42828;
}
.subsection-collapsible > .collapse-summary::-webkit-details-marker { display: none; }
.subsection-collapsible > .collapse-summary h3 {
  margin: 0; padding: 0; border: none;
}
.subsection-collapsible .collapse-chevron {
  color: #C42828; font-size: 14px; transition: transform 0.2s;
  display: inline-block; font-weight: 700;
}
.subsection-collapsible[open] .collapse-chevron { transform: rotate(180deg); }
.subsection-collapsible > .collapse-summary:hover h3 { color: #EF463C; }
.subsection-collapsible > .collapse-summary:hover .collapse-chevron { color: #EF463C; }

/* LICENSING */
.licensing-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.lic-card {
  background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 8px;
  padding: 14px; position: relative;
}
.lic-card.winner {
  background: rgba(114, 196, 191, 0.08); border-color: #72C4BF;
  box-shadow: 0 0 0 1px rgba(114, 196, 191, 0.5);
}
.lic-card.unviable { opacity: 0.5; background: #F5F5F5; }
.lic-card.unviable .lic-title { text-decoration: line-through; }
.lic-card .winner-badge {
  display: inline-block; padding: 2px 8px; background: #72C4BF; color: #FFFFFF;
  font-size: 10px; font-weight: 700; border-radius: 4px; margin-bottom: 8px;
  letter-spacing: 0.05em; text-transform: uppercase;
}
.lic-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  color: #3C3C3C; margin-bottom: 10px;
}
.lic-rows > div {
  display: flex; justify-content: space-between; padding: 5px 0;
  font-size: 12px; font-family: ui-monospace, monospace;
  border-bottom: 1px dotted #E5E5E5; color: #3C3C3C;
}
.lic-rows > div:last-child { border-bottom: none; }
.lic-rows .total {
  padding-top: 8px; margin-top: 4px;
  border-top: 1px solid #C42828 !important;
  font-size: 13px; color: #3C3C3C; font-weight: 700;
}
.lic-rows .total strong { color: #C42828; }
.lic-rows .free { color: #72C4BF; font-weight: 600; }
.lic-rows .premium {
  font-size: 11px; color: #999999; padding: 4px 0 0; border: none !important;
  font-style: italic;
}
.lic-rows .premium strong { color: #941914; font-style: normal; font-weight: 700; }
.unviable-note {
  font-size: 11px; color: #941914; margin-top: 8px; padding-top: 8px;
  border-top: 1px dotted #E5E5E5; font-style: italic;
}
.unviable-note.ppu-note { color: #999999; }

.crossover-note {
  font-size: 13px; padding: 10px 14px; background: rgba(114, 196, 191, 0.1);
  border-left: 3px solid #72C4BF; color: #3C3C3C; border-radius: 0 6px 6px 0;
}
.memory-warning {
  font-size: 13px; padding: 12px 14px;
  background: rgba(148, 25, 20, 0.06); border-left: 3px solid #941914;
  margin-bottom: 18px; line-height: 1.55; color: #3C3C3C;
  border-radius: 0 6px 6px 0;
}

/* SKU COMPARE — visual chart + check rows */
.sku-compare-chart {
  background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 8px;
  padding: 14px 16px 14px;
}
.sku-compare-chart svg { max-width: 100%; }
.sku-bars-svg { margin-bottom: 0; }
.sku-bars-svg text { font-family: "Mulish", Arial, sans-serif; }

/* SKU labels row — HTML grid below the SVG chart.
   Uses the SAME 3-column grid as the check blocks, so SKU labels
   sit precisely above their matching check block. */
.sku-labels-row {
  display: grid; gap: 0;
  padding: 6px 0 4px;
  border-bottom: 1px solid #E5E5E5;
}
.sku-label-col {
  text-align: center;
  padding: 4px 8px;
  display: flex; flex-direction: column; gap: 2px;
}
.sku-label-name {
  font-size: 18px; font-weight: 700; color: #3C3C3C;
  line-height: 1.1;
}
.sku-label-col.rec .sku-label-name { color: #C42828; }
.sku-label-col.licensing .sku-label-name { color: #72C4BF; }
.sku-label-cost {
  font-family: ui-monospace, monospace;
  font-size: 12px; color: #999999;
}
.sku-label-kicker {
  font-size: 10px;
  letter-spacing: 0.1em;
  color: #999999;
  text-transform: lowercase;
  margin-top: 2px;
  font-weight: 600;
}
.sku-label-col.rec .sku-label-kicker { color: #C42828; font-weight: 700; }
.sku-label-col.licensing .sku-label-kicker { color: #72C4BF; font-weight: 700; }

.licensing-driver-banner {
  display: flex; align-items: flex-start; gap: 10px;
  background: rgba(114, 196, 191, 0.10);
  border: 1px solid rgba(114, 196, 191, 0.5);
  border-left: 3px solid #72C4BF;
  border-radius: 0 6px 6px 0;
  padding: 11px 13px;
  margin-bottom: 14px;
  font-size: 12px;
  color: #3C3C3C;
  line-height: 1.55;
}
.licensing-driver-banner img { margin-top: 1px; flex-shrink: 0; }
.licensing-driver-banner strong { color: #C42828; font-weight: 700; }
.sku-chart-legend {
  display: flex; flex-wrap: wrap; gap: 14px;
  font-size: 11px; color: #3C3C3C;
  margin-bottom: 12px; padding-bottom: 10px;
  border-bottom: 1px dotted #E5E5E5;
}
.sku-chart-legend .legend-item {
  display: flex; align-items: center; gap: 6px;
}
.sku-chart-legend .legend-line {
  display: inline-block; width: 18px; height: 0;
  border-top: 1.5px dashed;
}
.sku-chart-legend .legend-line.peak { border-color: #941914; }
.sku-chart-legend .legend-line.req { border-color: #999999; }
.sku-chart-legend .legend-swatch {
  display: inline-block; width: 12px; height: 12px;
  border-radius: 2px;
}
.sku-chart-legend .legend-swatch.rec {
  background: #C42828; border: 1px solid #C42828;
}
.sku-chart-legend .legend-val {
  font-family: ui-monospace, monospace; color: #3C3C3C; font-weight: 700;
  margin-left: 2px;
}
.sku-compare-checks {
  display: grid; gap: 0;
  margin-top: 10px; padding-top: 0; border-top: none;
}
.sku-check-block {
  display: flex; flex-direction: column; gap: 4px;
  padding: 8px 10px; border-radius: 6px;
  background: #FFFFFF;
  margin: 0 4px;
  border: 1px solid #F5F5F5;
}
.sku-check-block.rec {
  background: rgba(196, 40, 40, 0.05);
  border: 1px solid rgba(196, 40, 40, 0.3);
}
.sku-check-block.licensing {
  background: rgba(114, 196, 191, 0.06);
  border: 1px dashed rgba(114, 196, 191, 0.6);
}
.sku-check { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #3C3C3C; }
.sku-check.ok .check-icon { color: #72C4BF; }
.sku-check.fail .check-icon { color: #941914; }
.sku-check.licensing-flag { color: #72C4BF; font-style: italic; font-weight: 600; }
.sku-check.licensing-flag img { margin-right: 2px; }
.check-icon { font-weight: 700; }
.sku-card-delta {
  font-size: 11px; margin-top: 2px; font-style: italic; font-weight: 600;
}
.sku-card-delta.more { color: #941914; }
.sku-card-delta.less { color: #72C4BF; }

/* TRACE */
.trace { display: flex; flex-direction: column; gap: 14px; }
.trace-section {
  background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 8px;
  padding: 14px 16px;
}
.trace-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: #C42828; font-weight: 700; margin-bottom: 8px;
}
.calc-table {
  width: 100%; border-collapse: collapse;
  font-family: ui-monospace, monospace; font-size: 12px;
}
.calc-table td {
  padding: 6px 0; border-bottom: 1px dotted #E5E5E5;
  vertical-align: top; color: #3C3C3C;
}
.calc-table td.num {
  text-align: right; font-weight: 600; white-space: nowrap;
  padding-left: 12px; color: #C42828;
}
.calc-table td.gold { color: #AD9BCB; }
.calc-table .total-row td {
  border-top: 2px solid #C42828; border-bottom: none;
  padding-top: 8px; font-weight: 700; color: #3C3C3C;
}
.formula { font-size: 10px; color: #999999; margin-top: 3px; font-style: italic; }
.cite { font-style: italic; color: #999999; font-size: 10px; margin-left: 6px; }

/* TCO */
.tco-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.tco-controls input[type="date"], .tco-controls input[type="number"] {
  background: #FFFFFF; border: 1px solid #C8C8C8; border-radius: 6px;
  padding: 10px 12px; color: #3C3C3C; font-size: 14px; font-family: inherit;
  width: 100%;
}

.tco-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 18px 0; }
.tco-card {
  background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 8px;
  padding: 14px; color: #3C3C3C;
}
.tco-card.gold {
  background: rgba(114, 196, 191, 0.08); border-color: #72C4BF;
}
.tco-card.win {
  background: rgba(196, 40, 40, 0.05); border-color: #C42828;
  box-shadow: 0 0 0 1px rgba(196, 40, 40, 0.3);
}
.tco-kicker {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: #999999; margin-bottom: 6px; font-weight: 700;
}
.tco-card.gold .tco-kicker { color: #72C4BF; }
.tco-card.win .tco-kicker { color: #C42828; }
.tco-num { font-size: 26px; font-weight: 700; line-height: 1; color: #3C3C3C; }
.tco-card.gold .tco-num { color: #72C4BF; }
.tco-card.win .tco-num { color: #C42828; }
.tco-sub { font-size: 11px; margin-top: 6px; color: #999999; }

.tco-chart-wrap { margin: 0; }

/* Chart card: title + pricing-mode toggle in header, chart below */
.tco-chart-card {
  background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 8px;
  padding: 14px 16px 16px; margin-bottom: 18px;
}
.tco-chart-card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
  padding-bottom: 10px; border-bottom: 1px dotted #E5E5E5;
}
.tco-chart-title {
  font-size: 12px; text-transform: lowercase; letter-spacing: 0.04em;
  color: #3C3C3C; font-weight: 700;
}
.tco-chart-mode-seg { max-width: 220px; min-width: 180px; }
.tco-chart-mode-seg button { font-size: 11px; padding: 7px; }

/* Legend above the chart — horizontal flex row, no inline right-padding needed */
.tco-legend {
  display: flex; flex-wrap: wrap; gap: 14px;
  font-size: 11px; color: #3C3C3C;
  margin-bottom: 10px;
}
.tco-legend-item {
  display: flex; align-items: center; gap: 6px;
}
.tco-legend-swatch {
  display: inline-block; width: 12px; height: 12px;
  border-radius: 2px; border: 1px solid;
}

.tco-chart {
  width: 100%; background: transparent;
  border: none;
}
.tco-chart text { font-family: "Mulish", Arial, sans-serif; }
.ax-lbl { font-size: 10px; fill: #999999; font-family: ui-monospace, monospace; }
.line-lbl { font-size: 11px; font-weight: 700; fill: #3C3C3C; }
.line-lbl.gold { fill: #AD9BCB; }

/* Export button + hint row, right under the chart */
.tco-export {
  display: flex; align-items: center; gap: 12px;
  margin: 0 0 18px;
}
.export-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: #C42828; color: #FFFFFF; border: none;
  padding: 9px 16px; border-radius: 6px;
  font-family: inherit; font-size: 12px; font-weight: 700;
  text-transform: lowercase; letter-spacing: 0.02em;
  cursor: pointer; transition: background 0.15s;
}
.export-btn:hover { background: #EF463C; }
.export-icon {
  display: inline-block; font-weight: 700; font-size: 14px;
  line-height: 1;
}
.export-hint {
  font-size: 11px; color: #999999; font-style: italic;
}

/* COST BREAKDOWN by env */
.cost-breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 0; }
.cost-col {
  background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 8px;
  padding: 16px;
}
.cost-col.prod-col { border-left: 3px solid #C42828; }
.cost-col.dev-col { border-left: 3px solid #999999; }
.cost-col-head {
  font-size: 12px; font-weight: 700; color: #3C3C3C;
  text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px;
}
.cost-rows { display: flex; flex-direction: column; }
.cost-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 7px 0; font-size: 12px; color: #3C3C3C;
  border-bottom: 1px dotted #E5E5E5;
}
.cost-row:last-child { border-bottom: none; }
.cost-row.sub { padding: 4px 0 4px 12px; }
.cost-row.sub .cite { color: #999999; font-size: 11px; }
.cost-row .num { font-family: ui-monospace, monospace; font-weight: 600; color: #3C3C3C; }
.cost-row .num.gold { color: #AD9BCB; }
.cost-row .num.cite { font-style: italic; color: #999999; font-weight: 400; font-size: 11px; }
.cost-row.total {
  margin-top: 6px; padding-top: 10px; border-top: 2px solid #C42828; border-bottom: none;
  font-weight: 700; color: #3C3C3C;
}
.cost-row.total.sub {
  border-top: none; padding: 3px 0; color: #AD9BCB;
}
.dev-controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
  margin: 10px 0 14px; padding: 10px 12px;
  background: rgba(114, 196, 191, 0.08); border-left: 2px solid #72C4BF;
  border-radius: 0 6px 6px 0;
}
.dev-control { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #3C3C3C; }
.dev-control-label { text-transform: lowercase; color: #999999; }
.dev-tier-select {
  background: #FFFFFF; border: 1px solid #C8C8C8; border-radius: 4px;
  padding: 3px 6px; font-family: inherit; font-size: 11px; color: #3C3C3C;
}
.dev-control-toggle { cursor: pointer; }
.dev-control-toggle input[type="checkbox"] { accent-color: #C42828; cursor: pointer; }

.rationale { border-top: 2px solid #C42828; padding-top: 16px; margin-top: 20px; }
.rationale-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
  font-weight: 700; margin-bottom: 8px; color: #C42828;
}
.rationale ul { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.65; color: #3C3C3C; }
.rationale li { margin-bottom: 6px; }
.rationale strong { color: #3C3C3C; font-weight: 700; }

/* SHAREABLE DISCLAIMER FOOTER */
.foot-divider { border: none; border-top: 0.5px solid #E2E2E2; margin: 40px 0 16px; }
.advisor-disclaimer {
  font-size: 12px; color: #999999; line-height: 1.6; margin: 0; max-width: 720px;
}
.advisor-disclaimer a { color: #C42828; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.advisor-disclaimer a:hover { color: #EF463C; }

/* DELAWARE TAGLINE FOOTER */
.delaware-footer {
  margin-top: 24px; padding-top: 24px;
  border-top: 1px solid #E5E5E5;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: #999999;
}
.delaware-tagline {
  color: #C42828; font-weight: 700; text-transform: lowercase;
  letter-spacing: 0.02em;
}

/* DOCUMENTATION PAGE */
.docs {
  font-family: "Mulish", "Century Gothic", "Arial", sans-serif;
  color: #3C3C3C; max-width: 860px; margin: 0 auto;
  padding: 28px 24px 64px; background: #FFFFFF; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.docs * { box-sizing: border-box; }
.docs h1 {
  font-size: 32px; font-weight: 700; margin: 0 0 10px;
  letter-spacing: -0.01em; line-height: 1.1; color: #3C3C3C;
  text-transform: lowercase;
}
.docs-header { border-bottom: 2px solid #C42828; padding-bottom: 22px; margin-bottom: 32px; }
.docs-back {
  background: transparent; border: none; padding: 0; margin-bottom: 16px;
  font-size: 11px; letter-spacing: 0.06em; color: #EF463C; cursor: pointer;
  text-transform: lowercase; font-weight: 700; font-family: inherit;
}
.docs-back:hover { color: #C42828; }
.docs .kicker { color: #C42828; text-transform: lowercase; }
.docs .lede { font-size: 14px; line-height: 1.6; color: #3C3C3C; margin: 0; max-width: 640px; }
.docs-section { margin-bottom: 36px; }
.docs-section h2 {
  font-size: 20px; font-weight: 700; margin: 0 0 14px;
  padding-bottom: 8px; border-bottom: 2px solid #C42828; color: #3C3C3C;
  text-transform: lowercase;
}
.docs-section h3 {
  font-size: 13px; font-weight: 700; margin: 18px 0 8px; color: #C42828;
  text-transform: lowercase; letter-spacing: 0.04em;
}
.docs-section p { font-size: 13px; line-height: 1.65; color: #3C3C3C; margin: 0 0 10px; }
.docs-section ul { font-size: 13px; line-height: 1.7; color: #3C3C3C; padding-left: 22px; margin: 0 0 12px; }
.docs-section li { margin-bottom: 4px; }
.docs-section strong { color: #3C3C3C; font-weight: 700; }
.docs-section code {
  background: #F5F5F5; padding: 2px 6px; border-radius: 4px;
  font-family: ui-monospace, monospace; font-size: 12px; color: #C42828;
}
.docs-formula {
  background: #F5F5F5; border: 1px solid #E5E5E5; border-radius: 6px;
  padding: 12px 14px; margin: 12px 0;
  font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.65;
  color: #3C3C3C;
}
.docs-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
.docs-table th {
  text-align: left; padding: 8px 10px; background: #C42828;
  border-bottom: none;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  font-weight: 700; color: #FFFFFF;
}
.docs-table td {
  padding: 8px 10px; border-bottom: 1px solid #E5E5E5;
  vertical-align: top; color: #3C3C3C;
}
.docs-table tr:nth-child(even) td { background: #F5F5F5; }
.docs-table strong { color: #3C3C3C; font-weight: 700; }
.docs-footer { margin-top: 28px; padding-top: 20px; border-top: 2px solid #C42828; }

.nav-btn {
  background: #C42828; color: #FFFFFF; border: none;
  padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit; text-transform: lowercase;
  letter-spacing: 0.02em;
}
.nav-btn:hover { background: #EF463C; }

/* MOBILE RESPONSIVE */
@media (max-width: 768px) {
  .advisor { padding: 18px 14px 48px; }
  .hero { flex-direction: column; align-items: stretch; gap: 18px; }
  .hero-stat { text-align: left; align-items: flex-start; border-left: none; border-top: 2px solid #F5F5F5; padding: 16px 0 0; }
  .stat-num { font-size: 38px; }
  .hero h1 { font-size: 24px; }

  .block-head h2 { font-size: 16px; gap: 10px; }
  .block-head p { margin-left: 0; font-size: 12px; }

  .tier-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .tier-card { padding: 12px; }
  .tier-label { font-size: 15px; }

  .arch-grid { grid-template-columns: 1fr; }

  .audience-row, .mult-grid { grid-template-columns: 1fr; }

  .result-block { padding: 16px; }
  .result-grid { grid-template-columns: 1fr; }
  .card-number { font-size: 36px; }

  .licensing-grid-3 { grid-template-columns: 1fr; }
  .cost-breakdown { grid-template-columns: 1fr; }
  .tco-controls { grid-template-columns: 1fr; }
  .tco-summary { grid-template-columns: 1fr; }
  .tco-chart-card-head { flex-direction: column; align-items: stretch; }
  .tco-chart-mode-seg { max-width: none; }
  .tco-export { flex-direction: column; align-items: stretch; gap: 6px; }
  .export-hint { text-align: center; }

  .model-size-picker { grid-template-columns: repeat(5, 1fr); gap: 3px; }
  .size-chip { padding: 5px 2px; }
  .size-chip-range { font-size: 8px; }
  .model-size-numeric { flex-direction: column; align-items: stretch; gap: 4px; }
  .model-size-numeric-label { text-align: center; }

  .delaware-footer { flex-direction: column; gap: 8px; align-items: flex-start; }

  .docs { padding: 18px 14px 48px; }
  .docs h1 { font-size: 24px; }
  .docs-section h2 { font-size: 18px; }
  .docs-table { font-size: 11px; }
  .docs-table th, .docs-table td { padding: 6px 6px; }
}

@media (max-width: 480px) {
  .tier-grid { grid-template-columns: 1fr; }
  .seg button { font-size: 11px; padding: 8px 4px; }
}
